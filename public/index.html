<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0818" />
  <title>🌙 月相塔罗</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 三层星空：装饰层（parallax） + 随机星点 + 发光星 -->
  <div class="starfield starfield--d"></div>
  <div class="starfield starfield--m"></div>
  <div class="starfield starfield--g"></div>
  <div class="shooting-star" id="shooting"></div>

  <!-- 主容器 -->
  <div class="app" id="app">

    <!-- =============== 今日运势 =============== -->
    <section class="view view--today" data-view="today" hidden>
      <header class="page-header">
        <h1>🌙 今日牌</h1>
        <p class="tagline" id="today-date">——</p>
      </header>
      <div class="today-body" id="today-body"></div>
    </section>

    <!-- =============== 占卜 =============== -->
    <section class="view view--divine" data-view="divine" hidden>
      <header class="page-header">
        <h1>🔮 占卜</h1>
        <p class="tagline">静心想一个问题…</p>
      </header>

      <!-- Stage 1：主题选择 -->
      <div class="stage" id="stage-theme">
        <p class="stage-title">选一个主题</p>
        <div class="chip-row" id="theme-chips"></div>
        <button class="btn btn--ghost" id="divine-skip-theme">跳过主题</button>
      </div>

      <!-- Stage 2：阵型选择 -->
      <div class="stage" id="stage-spread" hidden>
        <p class="stage-title">选一个阵型</p>
        <div class="spread-cards" id="spread-cards"></div>
        <button class="btn btn--ghost" id="divine-back-theme">← 返回</button>
      </div>

      <!-- Stage 3：问题输入 + 正逆位开关 -->
      <div class="stage" id="stage-question" hidden>
        <label class="stage-title" for="question-input">你的问题（可选）</label>
        <textarea id="question-input" rows="3" placeholder="比如：我和TA会怎样发展？"></textarea>
        <div class="settings-row">
          <label class="switch">
            <input type="checkbox" id="upright-only" />
            <span class="switch-slider"></span>
            <span class="switch-label">只抽正位</span>
          </label>
        </div>
        <button class="btn btn--ghost" id="divine-back-spread">← 返回</button>
        <button class="btn btn--primary" id="divine-start">开始占卜</button>
      </div>

      <!-- Stage 4：洗牌 -->
      <div class="stage" id="stage-shuffle" hidden>
        <p class="stage-title" id="shuffle-text">✨ 正在洗牌…</p>
        <div class="shuffle-area" id="shuffle-area"></div>
        <p class="hint">（双击屏幕可跳过动画）</p>
      </div>

      <!-- Stage 5：翻牌 -->
      <div class="stage" id="stage-reveal" hidden>
        <div class="spread-row" id="spread-row"></div>
        <div class="readings" id="readings"></div>
        <div class="final-block" id="final-block" hidden>
          <button class="btn btn--copy" id="copy-result">📋 复制结果</button>
          <button class="btn btn--ghost" id="save-result">💾 保存到记录</button>
          <button class="btn btn--ghost" id="divine-restart">🔄 重新占卜</button>
        </div>
      </div>
    </section>

    <!-- =============== 牌库 =============== -->
    <section class="view view--library" data-view="library" hidden>
      <header class="page-header">
        <h1>📚 牌库</h1>
        <div class="lib-tools">
          <input type="search" id="lib-search" placeholder="搜索中文名…" />
        </div>
      </header>
      <div class="lib-filters" id="lib-filters"></div>
      <div class="lib-grid" id="lib-grid"></div>
    </section>

    <!-- =============== 记录 =============== -->
    <section class="view view--history" data-view="history" hidden>
      <header class="page-header">
        <h1>📜 我的记录</h1>
      </header>
      <div class="history-list" id="history-list"></div>
      <div class="empty-hint" id="history-empty" hidden>还没有记录，去占卜一张吧～</div>
    </section>
  </div>

  <!-- 牌库详情抽屉 -->
  <div class="drawer" id="card-drawer" hidden>
    <div class="drawer-mask" data-drawer-close></div>
    <div class="drawer-panel">
      <button class="drawer-close" data-drawer-close>✕</button>
      <div id="drawer-body"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <!-- 底部标签栏 -->
  <nav class="tabbar" aria-label="主导航">
    <button class="tab" data-go="today"><span class="tab-ico">🌙</span><span class="tab-label">今日</span></button>
    <button class="tab tab--active" data-go="divine"><span class="tab-ico">🔮</span><span class="tab-label">占卜</span></button>
    <button class="tab" data-go="library"><span class="tab-ico">📚</span><span class="tab-label">牌库</span></button>
    <button class="tab" data-go="history"><span class="tab-ico">📜</span><span class="tab-label">记录</span></button>
  </nav>

  <!-- 合规声明 -->
  <footer class="disclaimer">
    内容仅供娱乐，不构成任何医疗、法律、投资建议。
  </footer>

  <script type="module" src="/app.js"></script>
</body>
</html>
